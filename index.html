<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/axios@1.13.2/dist/axios.min.js"></script>
    <link rel="stylesheet" href="src/index.css" />
    <title>Weather App</title>
  </head>
  <body>
    <div id="page">
      <header id="header">
        <form id="search-form">
          <input
            type="search"
            placeholder="Enter a city..."
            id="search-bar"
            required
            autofocus
          />
          <input type="submit" value="Search" id="submit-button" />
        </form>
      </header>
      <main>
        <div id="current-weather-display">
          <div>
            <h1></h1>
            <p class="weather-description">
              <span id="current-time"></span>, <span id="description"></span
              ><br />Humidity: <strong id="humidity"></strong>, Wind:
              <strong id="wind-speed"></strong>
            </p>
          </div>
          <div>
            <span id="weather-icon">⛅️</span>
            <span id="temperature-value"></span>
            <span id="temperature-unit">°C</span>
          </div>
        </div>
      </main>

      <footer>
        This project was coded by <a href="#" target="_blank">Alice Gall</a> and
        is <a href="#" target="_blank">open-sourced on GitHub</a> and
        <a href="https://www.netlify.com/" target="_blank">hosted on Netlify</a>
      </footer>
    </div>
    <script src="src/index.js"></script>
  </body>
</html>
