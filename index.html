<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/index.css" />
    <title>Weather App</title>
  </head>
  <body>
    <div id="page">
      <header id="header">
        <form>
          <input type="search" placeholder="Enter a city..." id="search-bar" />
          <input type="submit" value="Search" id="submit-button" />
        </form>
      </header>
      <main>
        <div>
          <h1>San Fransisco</h1>
          <p>
            Tuesday 14:49, scattered clouds<br />Humidity: <strong>66%</strong>,
            Wind: <strong>3.13km/h</strong>
          </p>
        </div>
        <div>⛅️12°C</div>
      </main>
      <footer>
        This project was coded by <a href="#" target="_blank">Alice Gall</a> and
        is <a href="#" target="_blank">open-sourced on GitHub</a> and
        <a href="https://www.netlify.com/" target="_blank">hosted on Netlify</a>
      </footer>
    </div>
  </body>
</html>
